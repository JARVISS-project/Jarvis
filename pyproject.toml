[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Assistente pessoal inteligente desenvolvido em Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
voice = [
    "av>=11,<17",
    "faster-whisper",
    "openwakeword",
    "pvrecorder",
    "pyttsx3",
]
neural-voice = [
    "chatterbox-tts>=0.1.7",
    "sounddevice>=0.5",
]
fast-voice = [
    "piper-tts>=1.6,<2",
    "sounddevice>=0.5",
]
ui = [
    "PySide6>=6.8,<7",
]
vision = [
    "Pillow>=10,<13",
    "pytesseract>=0.3,<1",
]
browser = [
    "playwright>=1.40,<2",
]
google = [
    "google-auth>=2.35,<3",
    "google-auth-oauthlib>=1.2,<2",
    "tzdata>=2025.2,<2027",
]

[project.scripts]
jarvis = "jarvis.__main__:main"
orca-play = "jarvis.orca_play:main"
jarvis-tasks = "jarvis.orca_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
