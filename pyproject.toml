[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Assistente pessoal inteligente desenvolvido em Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
voice = [
    "faster-whisper",
    "openwakeword",
    "pvrecorder",
    "pyttsx3",
]
neural-voice = [
    "chatterbox-tts>=0.1.7",
    "sounddevice>=0.5",
]
fast-voice = [
    "piper-tts>=1.6,<2",
    "sounddevice>=0.5",
]
ui = [
    "PySide6>=6.8,<7",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
